[project]
name = "hermes-memory"
version = "0.1.0"
description = "Computational verification of the Hermes memory system formalization"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "hypothesis>=6.0",
    "pytest>=7.0",
    "cmaes>=0.11",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "vulture>=2.11",
    "deptry>=0.16",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.2",
    "pytest-rerunfailures>=13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short --cov=hermes_memory --cov-fail-under=80 --cov-report=term-missing --durations=10 --reruns=2"
timeout = 300
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C901"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["hermes_memory"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.vulture]
min_confidence = 80
paths = ["hermes_memory", "tests"]

[tool.deptry]
ignore_notebooks = true
