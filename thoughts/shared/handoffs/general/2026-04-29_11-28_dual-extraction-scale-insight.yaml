# -- MENTAL MODEL (REQUIRED) -----------------------------------------------
mental_model: |
  The dual extraction pipeline works: schema extraction (v9 cache from Qwen2.5-7B) feeds
  a deriver (template or SLM like qwen2.5-3b) that produces NL observations. These are
  structurally grounded (97.9% grounding rate) and semantically rich.

  BUT observations HURT at ctx0 scale (1282 turns). BM25+cosine+reranker already finds
  the right evidence in small haystacks. Adding observations either pollutes BM25 IDF
  weights (counting Qs regress) or displaces real evidence in cosine ranking (5913 obs
  vs 1282 turns = 82% of vector index is observations).

  The REAL problem is LME-500 (56% SubEM, 280/500). 79% of failures there are retrieval
  misses — BM25 top-20 can't find relevant turns in much larger haystacks. Observations
  could bridge that gap by providing denser, more searchable summaries that point back
  to source turns.

  User's key insight: "same pipeline, better data" — the retrieval architecture shouldn't
  change. Observations should serve as a better search index, not a separate retrieval tier.
  Architecture: "search observations, serve turns" — use fact-dense observations as the
  search surface but return original conversation turns as evidence for the LLM.

  Code oracle is DEAD: 278/500 on LME-500 (vs 280/500 baseline). 0 improvements, 2
  regressions from oracle appending text to already-correct answers.

