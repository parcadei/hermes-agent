# -- DECISIONS -------------------------------------------------------------
decisions:
  - name: observations_vector_only
    chose: Store observations in vector index only, not BM25
    over: [observations in BM25, observations in both BM25+vector]
    because: "Observations in BM25 dilute IDF weights — counting Q qi=39 regressed from 17->8 correct. Vector-only had fewer regressions (1 vs 3)."
    constraint: BM25 integrity for counting/aggregation queries is non-negotiable

  - name: test_on_lme500_not_ctx0
    chose: Focus dual extraction testing on LME-500 scale
    over: [continue optimizing ctx0, test on 5-ctx subset]
    because: "At ctx0 scale (1282 turns), BM25 already finds the right evidence. Observations only add noise. At LME-500 scale (thousands of turns per question), 79% of failures are retrieval misses — observations could bridge that gap."
    constraint: User directive to focus on the actual problem, not optimize where it's already good

  - name: search_observations_serve_turns
    chose: Use observations as search index, return raw turns as evidence
    over: [separate retrieval tier, interleave observations in evidence, replace turns with observations]
    because: "User insight: 'same pipeline, better data'. The LLM needs actual conversation as evidence, not reformulated facts. Observations are denser and more searchable but less useful as evidence."
    constraint: Pipeline architecture stays the same, only the indexed data changes

  - name: code_oracle_dead
    chose: Abandon code oracle approach entirely
    over: [improve oracle prompting, restrict oracle to specific question types]
    because: "0 improvements on 500 questions. Oracle appends text that corrupts already-correct answers (Q101: overwrote '5 days' with refusal; Q459: added 'hiking' to trail name breaking SubEM)."
    constraint: Zero positive signal means no path to improvement

# -- FINDINGS --------------------------------------------------------------
findings:
  critical:
    - "Dual extraction HURTS at ctx0 scale (all 4 variants: 45-46/60 vs 48/60 baseline). Do NOT test on ctx0 again."
    - "5913 SLM observations vs 1282 turns = 82% of vector index is observations. This displacement ratio is the root cause of regressions."
    - "Code oracle DEAD on LME-500: 278/500 (-2 vs baseline). Zero improvements across 500 questions."
    - "LM Studio context overflow under concurrent load (2 processes hitting same model). Must run single process."
  useful:
    - "Template deriver ('The user X Y.') produces generic observations. SLM deriver (qwen2.5-3b) produces better NL but was WORSE on ctx0 eval (45/60 vs 46/60 for template)."
    - "Schema truncation needed: some chunks have 73 entities. Max 15 entities + 15 relations before sending to SLM."
    - "SLM outputs multiple JSON arrays — need re.finditer(r'\\[.*?\\]') parsing, not json.loads()."
    - "Training data pipeline stats: 3200 chunks, 97.9% grounded, 200 hallucinations dropped, 401 paraphrases fixed."
    - "Consolidation at 0.85 threshold only reduces 19% for template observations. May work better with SLM observations."
  fyi:
    - "Observation doc_ids start at 100_000 to avoid collision with turn indices."
    - "store._observation_texts dict holds observation text keyed by doc_id."
    - "Consolidation uses single-linkage union-find clustering on cosine similarity matrix."

# -- APPROACHES ------------------------------------------------------------
worked:
  - "Vector-only observation storage (no BM25) reduces regressions from 3 to 1"
  - "Schema truncation (15 ent + 15 rel) eliminates LM Studio 400 errors"
  - "Multi-array JSON parsing handles SLM output format"
  - "Training data grounding verification catches 97.9% of entities"

failed:
  - attempted: "Observations in BM25 index"
    root_cause: "Observation text inflates document count, diluting IDF weights for factual terms. Counting queries lose precision because 'days' appears in both turns and observations."
    avoid: "Never add derived/generated text to BM25 alongside source turns"
    use_instead: "Vector-only storage for derived content"

  - attempted: "SLM deriver on ctx0 eval"
    root_cause: "5913 observations overwhelm 1282 turns in cosine index (82% observations). Even though SLM observations are higher quality NL, they still displace the real evidence the LLM needs."
    avoid: "Testing observation impact at small haystack scale where retrieval already works"
    use_instead: "Test on LME-500 where retrieval coverage is the bottleneck"

  - attempted: "Code oracle on LME-500"
    root_cause: "SLM can't generate useful code from noisy evidence in large haystacks. Oracle appends text that corrupts already-correct answers."
    avoid: "Any code-generation approach for answer post-processing"
    use_instead: "Focus on retrieval quality, not post-processing"

  - attempted: "Consolidation via clustering (0.85 threshold)"
    root_cause: "Template observations are too uniform ('The user X Y.') — only 19% reduction. Insufficient semantic diversity for clustering to help."
