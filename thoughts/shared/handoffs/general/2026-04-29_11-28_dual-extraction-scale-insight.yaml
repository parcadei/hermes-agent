# -- STATUSLINE (REQUIRED) ------------------------------------------------
goal: Tested dual extraction (schema->deriver->observations) on ctx0 — all variants hurt SubEM. Identified correct test scale is LME-500.
now: Test "search observations, serve turns" architecture on LME-500 where retrieval coverage is the actual bottleneck (79% failures = retrieval misses).
