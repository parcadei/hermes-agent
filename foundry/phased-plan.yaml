    - FacetEntity
    - IngestionReport
    - VerbClassification
    - chunk_turns
    - classify_verb
    - infer_type
    - parse_conversation
    - route_to_layer
    - track_cooccurrences
    - verify_grounding
  foundry.retrieval:
    - AgenticRetriever
    - DeduplicationTracker
    - DeterministicRouter
    - RetrievalBudget
    - RetrievalTrace
    - TOOLS
  foundry.writeback:
    - DeletionPolicy
    - EntityMerger
    - SupersessionEngine
    - TemporalValidity
    - Tombstone
  foundry.dynamics:
    - DecayFunction
    - DreamConsolidator
    - HebbianBridge
    - ImportanceScore
    - MemorySystem
  foundry.core:
    - Foundry
    - FoundryConfig

module_graph:
  foundry/ontology.py: []
  foundry/storage.py:
    - foundry/ontology.py
  foundry/query.py:
    - foundry/ontology.py
    - foundry/storage.py
  foundry/ingestion.py:
    - foundry/ontology.py
    - foundry/storage.py
  foundry/writeback.py:
    - foundry/ontology.py
    - foundry/storage.py
  foundry/retrieval.py:
    - foundry/ontology.py
    - foundry/storage.py
    - foundry/query.py
  foundry/core.py:
    - foundry/ontology.py
    - foundry/storage.py
    - foundry/query.py
    - foundry/ingestion.py
    - foundry/writeback.py
    - foundry/retrieval.py
  foundry/dynamics.py:
    - foundry/storage.py
    - foundry/core.py

implementation_order:
  - foundry/ontology.py
  - foundry/storage.py
  - foundry/query.py
  - foundry/ingestion.py
  - foundry/writeback.py
  - foundry/retrieval.py
  - foundry/core.py
  - foundry/dynamics.py

critical_path:
  - foundry/ontology.py
  - foundry/storage.py
  - foundry/query.py
  - foundry/retrieval.py
  - foundry/core.py
  - foundry/dynamics.py

planning_notes:
  - QueryPlan should remain resolver-agnostic at the module boundary. The spec defines resolution semantics in section 3.4, but tests require EntityResolver to be exported from foundry.ingestion; inject that behavior through core/store wiring to avoid a query-ingestion import cycle.
  - estimated_tests is the sum of test functions in files that directly import the module, using AST counts from foundry/tests.
  - Spec appendices materially change implementation order. Appendix A/B/C/D sections listed below are treated as normative refinements, not optional extras.

